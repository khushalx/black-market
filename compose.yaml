services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blackmarket
      POSTGRES_PASSWORD: blackmarket
      POSTGRES_DB: blackmarket
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - blackmarket_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackmarket -d blackmarket"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  blackmarket_pg:
